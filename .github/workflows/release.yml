name: Release

# Gated release pipeline (R03).
# - Triggered only via workflow_dispatch (never auto on tag push).
# - Build job runs required checks on the EXACT revision (github.sha).
# - Artifacts (main.js, manifest.json, styles.css) are built once and uploaded with SHA256 checksums.
# - Publish job is separately gated (needs: build) and uses minimal permissions.
# - Provenance metadata (commit SHA, version) is included in the release body.
# - This job does NOT publish to npm or any registry; it creates a GitHub Release only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must exactly match package.json and manifest.json)'
        required: true
        type: string
      create_release:
        description: 'Create the GitHub Release from the built artifacts'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify version consistency
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/check-release.js "$RELEASE_VERSION"

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          sha256sum main.js manifest.json styles.css > checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          retention-days: 7

  publish:
    needs: build
    # Only run if the caller explicitly requested release creation.
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    # Minimal permissions: only contents:write to create a release.
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/

      - name: Create GitHub Release with provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          SHA="$RELEASE_SHA"
          (cd dist && sha256sum --check checksums.txt)
          NOTES_FILE="$(mktemp)"

          # NOTE: the --title below and the Highlights list inside the heredoc are
          # VERSION-SPECIFIC — update them as part of each release commit. If they
          # drift after publication, `gh release edit` can correct the release.
          cat > "$NOTES_FILE" <<EOF
          MUGS — Multi-User Git Sync v${VERSION}

          Built from commit: ${SHA}
          CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Artifacts (SHA256):
          $(cat dist/checksums.txt)

          This release was created by the gated release workflow.
          Required checks (typecheck + test + build + version-consistency) passed on ${SHA}.

          Highlights:
          - Second deep-audit sweep: a full re-read of the sync core, data plane, git layer, providers, runtime and UI against the shipped code, with every finding fixed and pinned by tests before publication.
          - Trash namespace collision fixed: mirror-pull vault deletions and overwrites recorded their recovery copies under vault-root-relative keys while every other recorder used repo-relative keys — two different files could collide on one .mugs-trash key whenever a repository folder shares the mapping's local-folder name, and a remote-driven deletion's restore could recover an empty copy. All recorders now share the repo-relative namespace, pinned by a new real-git end-to-end test.
          - Trash key validation: the trash store validates mapping ids and paths before any disk access (reject, never sanitize). Recording and clearing throw on unsafe input — an unrecordable deletion cannot proceed and the recursive remove never sees an escaped path — while reads degrade to empty results.
          - unlock() truly never throws: corrupt persisted key-derivation parameters (for example an invalid salt in data.json) resolve to a failed unlock instead of throwing out of the settings flow; credentials simply stay locked.
          - Dead code and stale comments removed: unused paginateAllSafe, redactCredential and renderDiffText; the autoResolvedPaths merge vestige; a misleading mirrorPull parameter name; pre-S06 comments claiming genuine conflicts were auto-resolved (they are always surfaced for review).
          - Live-suite hardening: the real-vault resolution suite's leftover cleanup now scans the whole repository, and the real-vault rollout gate asserts structural fail-closed invariants instead of a point-in-time snapshot of the vault's saved state.

          Diff compares committed snapshots; unsynced vault edits are not included.
          Binary text reconciliation is blocked rather than risking content corruption.
          Desktop Git text sync only: attachment, configuration, mobile and encrypted-vault
          parity with Obsidian Sync is not claimed. Company rollout requires separate
          supported-platform, app-level and multi-client canary validation.
          Back up vault content, plugin data, and clones before upgrading. Rollback requires
          compatible settings/state as well as the previous plugin assets; do not delete dirty clones.
          EOF

          gh release create "${VERSION}" \
            --target "$SHA" \
            --title "${VERSION} — second deep-audit sweep (trash namespace + validation, unlock robustness)" \
            --notes-file "$NOTES_FILE" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            dist/checksums.txt
