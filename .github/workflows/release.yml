name: Release

# Gated release pipeline (R03).
# - Triggered only via workflow_dispatch (never auto on tag push).
# - Build job runs required checks on the EXACT revision (github.sha).
# - Artifacts (main.js, manifest.json, styles.css) are built once and uploaded with SHA256 checksums.
# - Publish job is separately gated (needs: build) and uses minimal permissions.
# - Provenance metadata (commit SHA, version) is included in the release body.
# - This job does NOT publish to npm or any registry; it creates a GitHub Release only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must exactly match package.json and manifest.json)'
        required: true
        type: string
      create_release:
        description: 'Create the GitHub Release from the built artifacts'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify version consistency
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/check-release.js "$RELEASE_VERSION"

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          sha256sum main.js manifest.json styles.css > checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          retention-days: 7

  publish:
    needs: build
    # Only run if the caller explicitly requested release creation.
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    # Minimal permissions: only contents:write to create a release.
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/

      - name: Create GitHub Release with provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          SHA="$RELEASE_SHA"
          (cd dist && sha256sum --check checksums.txt)
          NOTES_FILE="$(mktemp)"

          cat > "$NOTES_FILE" <<EOF
          MUGS — Multi-User Git Sync v${VERSION}

          Built from commit: ${SHA}
          CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Artifacts (SHA256):
          $(cat dist/checksums.txt)

          This release was created by the gated release workflow.
          Required checks (typecheck + test + build + version-consistency) passed on ${SHA}.

          Highlights:
          - Company-wide release polish: documentation corrected against the shipped code (architecture notes, module map, status-bar routing, review-surface references and test counts), provider walkthroughs updated for the automatic first-connection pause, and package metadata completed (repository, homepage, issues, engines).
          - Deep-audit fixes folded in before publication: the .drawing extension now really matches the binary guard (its set entry was capitalized, so case-insensitive lookups missed it); a rename out of a mapped folder triggers a pass immediately instead of waiting for the next poll; the plugin and its live diagnostics share one canonical binary-extension set; dead CSS selectors, a dead export and stale comments removed. Otherwise plugin behavior is unchanged from 0.4.6.
          - Simpler backup acknowledgment on the Preflight & rollout page: the single page-level checkbox that armed every canary is gone. Each folder's detail pane now carries its own acknowledgment directly beside the Run canary button it arms — one decision, one place, per folder.
          - .aseprite joined the binary-extension guard (from 0.4.5): Aseprite sprite files (and their remote twins) are excluded from sync scope up front, so a diverged binary file no longer produces a blocked outcome on every pass — which also unblocked staged-rollout canaries for folders carrying such files (the NUL-byte merge guard remains the fail-safe for any unlisted binary type).
          - Blocked-file notices tell the truth about binary exclusions (from 0.4.5): an ok pass with only binary-content blocks says "not synced — binary content is excluded from text sync" instead of pointing at a Review queue that never contained an entry for them; mixed cases mention both surfaces. Wording lives in a pure, tested helper (statusReport).
          - Preflight & rollout page rebuilt to match the Review page's layout and visual language (from 0.4.4): a folder sidebar with live status dots and a search filter beside a detail pane showing saved evidence, blockers, rollout state and per-folder actions.
          - Live sync status on the rollout surface: each folder row and detail pane shows its last recorded sync status (synced, up to date, conflict needs review, sync failed, sync pending) with the driver-recorded skip reason when a pass could not complete — saved evidence only, refreshed via pushed UI updates instead of polling.
          - Staged rollout with guarded canaries (from 0.4.3): staged mode starts with nothing automatic; a one-shot canary per folder must pass verifiably clean (no conflicts, deferred changes, pending work or review backlog) and persist before the folder joins automatic sync. Failures fail closed with the reason recorded; unsavable rollout decisions pause automatic sync.
          - Multi-client soak gate: a release-gate test drives two full independent clients against one shared repository — distinct and non-overlapping edits converge automatically, same-region conflicts surface with both sides intact, one-click resolution converges everyone, deletions propagate, converged passes are verified no-ops.
          - Bulk repository-file review: on-demand, read-only analysis groups review entries into exact-content duplicate/move candidates, filename-only candidates, no-match and inconclusive scans; batch decisions with path lists, diff comparisons and explicit confirmation.
          - Deletion safeguards unchanged: revision-bound decisions, recovery backups before deletion, push-only cannot delete, filenames never imply identity.

          Diff compares committed snapshots; unsynced vault edits are not included.
          Binary text reconciliation is blocked rather than risking content corruption.
          Desktop Git text sync only: attachment, configuration, mobile and encrypted-vault
          parity with Obsidian Sync is not claimed. Company rollout requires separate
          supported-platform, app-level and multi-client canary validation.
          Back up vault content, plugin data, and clones before upgrading. Rollback requires
          compatible settings/state as well as the previous plugin assets; do not delete dirty clones.
          EOF

          gh release create "${VERSION}" \
            --target "$SHA" \
            --title "${VERSION} — company-wide release polish (docs + packaging)" \
            --notes-file "$NOTES_FILE" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            dist/checksums.txt
