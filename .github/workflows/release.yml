name: Release

# Gated release pipeline (R03).
# - Triggered only via workflow_dispatch (never auto on tag push).
# - Build job runs required checks on the EXACT revision (github.sha).
# - Artifacts (main.js, manifest.json, styles.css) are built once and uploaded with SHA256 checksums.
# - Publish job is separately gated (needs: build) and uses minimal permissions.
# - Provenance metadata (commit SHA, version) is included in the release body.
# - This job does NOT publish to npm or any registry; it creates a GitHub Release only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must exactly match package.json and manifest.json)'
        required: true
        type: string
      create_release:
        description: 'Create the GitHub Release from the built artifacts'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify version consistency
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/check-release.js "$RELEASE_VERSION"

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          sha256sum main.js manifest.json styles.css > checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          retention-days: 7

  publish:
    needs: build
    # Only run if the caller explicitly requested release creation.
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    # Minimal permissions: only contents:write to create a release.
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/

      - name: Create GitHub Release with provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          SHA="$RELEASE_SHA"
          (cd dist && sha256sum --check checksums.txt)
          NOTES_FILE="$(mktemp)"

          cat > "$NOTES_FILE" <<EOF
          MUGS — Multi-User Git Sync v${VERSION}

          Built from commit: ${SHA}
          CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Artifacts (SHA256):
          $(cat dist/checksums.txt)

          This release was created by the gated release workflow.
          Required checks (typecheck + test + build + version-consistency) passed on ${SHA}.

          Highlights:
          - Staged rollout with guarded canaries: the new Preflight & rollout page switches a vault to staged mode (nothing automatic until individually enabled) and runs a one-shot canary per folder — a real targeted sync pass that must be verifiably clean (no conflicts, deferred changes, pending work or review backlog) and persisted before the folder joins automatic sync. Failures fail closed with the reason recorded; unsavable rollout decisions pause automatic sync.
          - Multi-client soak gate: a new release-gate test drives two full independent clients against one shared repository — distinct and non-overlapping edits converge automatically, same-region conflicts surface with both sides intact, one-click resolution converges everyone, deletions propagate, converged passes are verified no-ops.
          - Review analysis sized for real vaults: scan budgets raised to 20,000 files / 8 MiB per file / 512 MiB total; budget-limited scans still report unmatched results as inconclusive, never as proof of absence. .apk joined the binary-extension guard.
          - Bulk repository-file review: on-demand, read-only analysis groups review entries into exact-content duplicate/move candidates, filename-only candidates, no-match and inconclusive scans; batch decisions with path lists, diff comparisons and explicit confirmation (one folder, one sync pass, up to 500 files).
          - Deletion safeguards unchanged: revision-bound decisions, recovery backups before deletion, Download only cannot delete, filenames never imply identity.
          - Review intent that cannot persist is rolled back instead of applying later; sync locks always release; analysis can be cancelled before deciding.
          - Revision-bound pending recovery, merged deletion protection, guarded editor mutations, exclusive clone locks and accurate pending/blocked status reporting.
          - Docs: new guided-rollout guide (staged enablement, canaries, company checklist, Obsidian Sync comparison) plus updated install/provider walkthroughs.

          Diff compares committed snapshots; unsynced vault edits are not included.
          Binary text reconciliation is blocked rather than risking content corruption.
          Desktop Git text sync only: attachment, configuration, mobile and encrypted-vault
          parity with Obsidian Sync is not claimed. Company rollout requires separate
          supported-platform, app-level and multi-client canary validation.
          Back up vault content, plugin data, and clones before upgrading. Rollback requires
          compatible settings/state as well as the previous plugin assets; do not delete dirty clones.
          EOF

          gh release create "${VERSION}" \
            --target "$SHA" \
            --title "${VERSION} — staged rollout with guarded canaries" \
            --notes-file "$NOTES_FILE" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            dist/checksums.txt
